plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.kingdomsiege'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.kingdomsiege"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.6"
